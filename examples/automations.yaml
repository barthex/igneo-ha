# Example automations for Estyma Igneo Slim integration
# Copy these to your Home Assistant automations.yaml and customize as needed

# Alert when fuel is low (< 50kg)
- alias: "Igneo - Low Fuel Alert"
  description: "Send notification when fuel counter drops below 50kg"
  trigger:
    - platform: state
      entity_id: binary_sensor.igneo_low_fuel_alert
      to: "on"
  action:
    - service: notify.notify
      data:
        message: "⛽ Low fuel alert! Only {{ (state_attr('sensor.igneo_fuel_counter', 'value') | int(0)) / 1000 }}kg remaining"
        title: "Estyma Igneo Slim"

# Alert on high boiler temperature
- alias: "Igneo - High Boiler Temperature Alert"
  description: "Send alert if boiler temperature exceeds 80°C"
  trigger:
    - platform: state
      entity_id: binary_sensor.igneo_high_boiler_temperature
      to: "on"
  action:
    - service: notify.notify
      data:
        message: "🔥 High boiler temperature: {{ state_attr('sensor.igneo_boiler_temperature', 'value') }}°C"
        title: "Estyma Igneo Slim"

# Increase CWU temperature button automation
- alias: "Igneo - Increase CWU Temperature"
  description: "Increase hot water temperature by 1°C"
  trigger:
    - platform: state
      entity_id: input_boolean.igneo_increase_temp
      to: "on"
  action:
    - service: igneo.increase_temperature
      data:
        device_id: "YOUR_DEVICE_ID"  # Change to your device ID
    - service: input_boolean.turn_off
      entity_id: input_boolean.igneo_increase_temp

# Decrease CWU temperature button automation
- alias: "Igneo - Decrease CWU Temperature"
  description: "Decrease hot water temperature by 1°C"
  trigger:
    - platform: state
      entity_id: input_boolean.igneo_decrease_temp
      to: "on"
  action:
    - service: igneo.decrease_temperature
      data:
        device_id: "YOUR_DEVICE_ID"  # Change to your device ID
    - service: input_boolean.turn_off
      entity_id: input_boolean.igneo_decrease_temp

# Morning boost - increase temperature at 6 AM
- alias: "Igneo - Morning Temperature Boost"
  description: "Increase CWU temperature in the morning for hot water availability"
  trigger:
    - platform: time
      at: "06:00:00"
  condition:
    - condition: state
      entity_id: binary_sensor.igneo_burner_active
      state: "off"
  action:
    - service: igneo.set_cwu_temperature
      data:
        device_id: "YOUR_DEVICE_ID"  # Change to your device ID
        temperature: 50

# Night economy mode - decrease temperature at 22:00
- alias: "Igneo - Night Economy Mode"
  description: "Decrease CWU temperature at night for energy saving"
  trigger:
    - platform: time
      at: "22:00:00"
  action:
    - service: igneo.set_cwu_temperature
      data:
        device_id: "YOUR_DEVICE_ID"  # Change to your device ID
        temperature: 42

# Vacation mode - minimal heating
- alias: "Igneo - Vacation Mode Activated"
  description: "Set minimal heating when leaving home for vacation"
  trigger:
    - platform: state
      entity_id: input_boolean.vacation_mode
      to: "on"
  action:
    - service: igneo.set_cwu_temperature
      data:
        device_id: "YOUR_DEVICE_ID"  # Change to your device ID
        temperature: 35
    - service: igneo.set_room_temperature
      data:
        device_id: "YOUR_DEVICE_ID"  # Change to your device ID
        temperature: 15

# Daily fuel consumption log
- alias: "Igneo - Daily Statistics Log"
  description: "Log fuel consumption and boiler statistics daily at 23:00"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - service: logger.log
      data:
        level: INFO
        message: |
          Igneo Daily Statistics:
          Fuel counter: {{ (state_attr('sensor.igneo_fuel_counter', 'value') | int(0)) / 1000 }}kg
          Boiler temperature: {{ state_attr('sensor.igneo_boiler_temperature', 'value') }}°C
          Room temperature: {{ state_attr('sensor.igneo_room_temperature', 'value') }}°C
          Burner status: {{ state_attr('sensor.igneo_burner_status', 'value') }}
          CWU temperature: {{ state_attr('sensor.igneo_cwu_temperature', 'value') }}°C
