# Example Lovelace configuration for Estyma Igneo Slim
# Add this to your Home Assistant dashboard or lovelace configuration

type: vertical-stack
cards:
  # Header
  - type: heading
    heading: "🔥 Estyma Igneo Slim Boiler System"
    heading_level: 2

  # Status overview
  - type: entities
    title: "System Status"
    entities:
      - entity: sensor.igneo_burner_status
        name: "Burner Status"
      - entity: binary_sensor.igneo_burner_active
        name: "Currently Heating"
      - entity: binary_sensor.igneo_low_fuel_alert
        name: "Low Fuel Alert"
      - entity: binary_sensor.igneo_high_boiler_temperature
        name: "High Temperature Alert"

  # Temperature monitoring
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.igneo_boiler_temperature
        name: "Boiler"
        icon: mdi:thermometer
        show_state: true
        state_display: "[[[ return entity.state + '°C' ]]]"

      - type: custom:button-card
        entity: sensor.igneo_room_temperature
        name: "Room"
        icon: mdi:home-thermometer
        show_state: true
        state_display: "[[[ return entity.state + '°C' ]]]"

      - type: custom:button-card
        entity: sensor.igneo_cwu_temperature
        name: "Hot Water"
        icon: mdi:water-thermometer
        show_state: true
        state_display: "[[[ return entity.state + '°C' ]]]"

  # Hot Water (CWU) Temperature Control
  - type: thermostat
    entity: climate.igneo_hot_water_cwu
    title: "Hot Water Temperature"

  # Room Temperature Control
  - type: thermostat
    entity: climate.igneo_room_temperature
    title: "Room Temperature"

  # Fuel consumption gauge
  - type: gauge
    entity: sensor.igneo_fuel_counter
    unit: kg
    min: 0
    max: 100
    segments:
      - from: 0
        color: "#e74c3c"
      - from: 25
        color: "#f39c12"
      - from: 50
        color: "#f1c40f"
      - from: 75
        color: "#2ecc71"
    needle: true
    title: "Fuel Level"

  # Quick action buttons
  - type: horizontal-stack
    cards:
      - type: button
        name: "Increase Temp"
        icon: mdi:chevron-up
        tap_action:
          action: call-service
          service: igneo.increase_temperature
          data:
            device_id: "YOUR_DEVICE_ID"

      - type: button
        name: "Decrease Temp"
        icon: mdi:chevron-down
        tap_action:
          action: call-service
          service: igneo.decrease_temperature
          data:
            device_id: "YOUR_DEVICE_ID"

  # Additional statistics
  - type: entities
    title: "Boiler Statistics"
    entities:
      - entity: sensor.igneo_fuel_counter
        name: "Fuel Counter"
      - entity: sensor.igneo_oxygen_level
        name: "Oxygen Level in Exhaust"
      - entity: sensor.igneo_boiler_calculated_temperature
        name: "Calculated Temperature"
      - entity: sensor.igneo_device_type
        name: "Device Type"

  # Temperature history chart (requires mini-graph-card custom component)
  # Install from HACS: Frontend → mini-graph-card
  - type: custom:mini-graph-card
    entities:
      - sensor.igneo_boiler_temperature
      - sensor.igneo_room_temperature
      - sensor.igneo_cwu_temperature
    name: "Temperature History"
    line_width: 2
    font_size: 80
    hours_to_show: 24
