name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ custom_components/ --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Test API client
      run: |
        echo "API client structure validated"
        python -c "from src.igneo_api import IgleoClient; print('✓ IgleoClient imports OK')"

    - name: Check Home Assistant integration
      run: |
        echo "✓ HA integration files present"
        test -f custom_components/igneo/manifest.json
        test -f custom_components/igneo/__init__.py
        test -f custom_components/igneo/sensor.py
        test -f custom_components/igneo/climate.py
